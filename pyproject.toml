[project]
name = "eozilla-eoap"
version = "0.0.1.dev0"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Florian-Katerndahl", email = "Florian-Katerndahl@users.noreply.github.com"},
    {name = "forman", email = "forman@users.noreply.github.com"},
    {name = "pont-us", email = "pont-us@users.noreply.github.com"},
]
keywords = [
  "cwl",
  "eo",
  "eoap",
  "esa",
  "data processing",
  "ogc",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Operating System :: MacOS",
]
requires-python = ">= 3.11"
dependencies = [
  "fastapi",
  "pydantic",
  "pyyaml",
  "typer >=0.26.0,<1",
  "uvicorn",
  # Eozilla dependency
  "gavicore",
  "wraptile",
  "cwl-utils>=0.42,<0.43",
  "cwltool>=3.2.20260413085819,<4",
  "pystac[validation,urllib3]>=1.15.2,<2",
]

[project.urls]
Repository = "https://github.com/eo-tools/eozilla-eoap"
Changelog = "https://github.com/eo-tools/eozilla-eoap/blob/main/CHANGES.md"
Issues = "https://github.com/eo-tools/eozilla-eoap/issues"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# --- tools configuration

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = [
  "src/eozilla_eoap/**/*",
  "pyproject.toml",
  "README.md",
  "LICENSE",
]

[tool.isort]
skip = [".idea", ".github", ".pixi", "htmlcov", "site"]
profile = "black"
line_length = 88

[tool.black]
line-length = 88

[tool.ruff.lint]
select = [
    "B", # pycodestyle (coding style)
    "E", # pyflakes (basic errors)
    "F", # bugbear (common logic issues)
    "I", # Isort (import order)
    "S", # Bandit (security checks)
]
ignore = [
    "E501",  # line-too-long
    "I001",  # unsorted-imports
    "S101", # assert
]
per-file-ignores = { "*.ipynb" = ["E402"] }
isort = { relative-imports-order = "closest-to-furthest" }

# --- pixi configuration

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64"]

[tool.pixi.pypi-dependencies]
# eozilla-eoap source package
eozilla_eoap = { path = ".", editable = true }
# eozilla source packages
gavicore = { path = "../eozilla/gavicore", editable = true }
procodile = { path = "../eozilla/procodile", editable = true }
wraptile = { path = "../eozilla/wraptile", editable = true }

[tool.pixi.dependencies]
# Combined eozilla-eopa + wraptile dependencies to prevent our editable
# PyPI dependencies (our project's sub-workspaces) to install
# PyPI packages instead of using conda packages.
fastapi = "*"
httpx = "*"
pydantic-settings = "*"
pyyaml = "*"
typer = ">=0.26.0"
uri-template = "*"
uvicorn = "*"
# IDE integration
pixi-pycharm = ">=0.0.11"
# Development & build tools
pip = "*"
hatch = "*"
# Build for publication
rattler-build = ">=0.48.1,<0.49"
twine = ">=6.2.0,<7"
# Code style & linting
isort = "*"
ruff = "*"
mypy = "*"
# Unit-testing
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
# Use cases testing
dask = "*"
geopandas = "*"
pandas = "*"
xarray = "*"
# zarr 3.2.x can no longer work with Windows file URIs, like file:///C:/...
zarr = ">=3.1,<3.2"
pydantic = ">=2.13.4,<3"

[tool.pixi.tasks]
